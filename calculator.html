<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5e9ef;
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 330px;
            padding: 20px;
            border-radius: 25px;
            background: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .display {
            width: 100%;
            height: 80px;
            border: none;
            outline: none;
            border-radius: 18px;
            background: #f7f2f4;
            text-align: right;
            padding: 15px;
            font-size: 32px;
            color: #4d4147;
            margin-bottom: 18px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 17px;
            background: #f3e5eb;
            color: #51454b;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.04);
            background: #ead5df;
        }

        .operator {
            background: #dcebdc;
            color: #405640;
        }

        .clear {
            background: #f2cfdc;
            color: #754b5b;
        }

        .equal {
            background: #c9dfca;
            color: #385338;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteNumber()">⌫</button>
            <button class="operator" onclick="addOperator('%')">%</button>
            <button class="operator" onclick="addOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

    </div>

    <script>
        let display = document.getElementById("display");

        function addNumber(number) {
            if (display.value === "0") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function addOperator(operator) {
            let last = display.value.slice(-1);

            if ("+-*/%".includes(last)) {
                display.value = display.value.slice(0, -1) + operator;
            } else {
                display.value += operator;
            }
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = "0";
            }
        }

        function calculate() {
            try {
                let result = Function(
                    '"use strict"; return (' + display.value + ')'
                )();

                if (Number.isFinite(result)) {
                    display.value = result;
                } else {
                    display.value = "Error";
                }
            } catch {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
