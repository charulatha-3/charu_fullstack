
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

/* YOUR ORIGINAL CSS — UNCHANGED */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap'); 
 
* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
} 
 
body { 
    font-family: 'Poppins', sans-serif; 
    min-height: 100vh; 
    padding: 40px 15px; 
    background: 
        radial-gradient(circle at 10% 20%, #e8d5ff 0%, transparent 25%), 
        radial-gradient(circle at 90% 80%, #d8c1ff 0%, transparent 25%), 
        linear-gradient(135deg, #f5edff, #eadbff, #f8f1ff); 
 
    color: #4b286d; 
    overflow-x: hidden; 
} 
 
body::before { 
    content: "✦  ♡  ✧  💜  ✦  ♡"; 
    position: fixed; 
    top: 20px; 
    left: 5%; 
    color: #b88bea; 
    font-size: 25px; 
    letter-spacing: 20px; 
    opacity: 0.5; 
    animation: float 5s ease-in-out infinite; 
    pointer-events: none; 
} 
 
body::after { 
    content: "♡  ✧  ✦  💜  ♡"; 
    position: fixed; 
    bottom: 20px; 
    right: 5%; 
    color: #a875d5; 
    font-size: 25px; 
    letter-spacing: 15px; 
    opacity: 0.5; 
    animation: float 6s ease-in-out infinite reverse; 
    pointer-events: none; 
} 
 
@keyframes float { 
    0%, 100% { 
        transform: translateY(0); 
    } 
 
    50% { 
        transform: translateY(-15px); 
    } 
} 
 
.container { 
    position: relative; 
    max-width: 900px; 
    margin: auto; 
    padding: 40px; 
    background: rgba(255, 255, 255, 0.88); 
    border: 2px solid rgba(190, 143, 236, 0.35); 
    border-radius: 30px; 
 
    box-shadow: 
        0 20px 50px rgba(111, 63, 145, 0.18), 
        0 5px 15px rgba(142, 89, 184, 0.1); 
 
    backdrop-filter: blur(12px); 
} 
 
.container::before { 
    content: "♡"; 
    position: absolute; 
    top: 18px; 
    right: 25px; 
    color: #c18bea; 
    font-size: 35px; 
    animation: heartbeat 1.8s infinite; 
} 
 
@keyframes heartbeat { 
    0%, 100% { 
        transform: scale(1); 
    } 
 
    50% { 
        transform: scale(1.25); 
    } 
} 
 
h1 { 
    font-family: 'Baloo 2', cursive; 
    text-align: center; 
    font-size: 42px; 
    color: #7b3fa0; 
    margin-bottom: 8px; 
} 
 
h1::after { 
    content: " ✨"; 
} 
 
h2 { 
    font-family: 'Baloo 2', cursive; 
    font-size: 30px; 
    color: #713994; 
    margin-top: 35px; 
    margin-bottom: 15px; 
} 
 
.form-group { 
    margin-bottom: 20px; 
} 
 
label { 
    display: block; 
    margin-bottom: 8px; 
    font-weight: 600; 
    color: #60347c; 
} 
 
input, 
select, 
textarea { 
    width: 100%; 
    padding: 14px 16px; 
 
    font-family: 'Poppins', sans-serif; 
    font-size: 14px; 
 
    color: #56306e; 
    background: #fbf8ff; 
 
    border: 2px solid #dfc8f2; 
    border-radius: 14px; 
 
    transition: all 0.3s ease; 
} 
 
input::placeholder, 
textarea::placeholder { 
    color: #b49ac4; 
} 
 
input:hover, 
select:hover, 
textarea:hover { 
    border-color: #c194e3; 
} 
 
input:focus, 
select:focus, 
textarea:focus { 
    outline: none; 
    border-color: #9858c7; 
    background: #ffffff; 
 
    box-shadow: 
        0 0 0 4px rgba(152, 88, 199, 0.12), 
        0 5px 15px rgba(152, 88, 199, 0.1); 
 
    transform: translateY(-1px); 
} 
 
textarea { 
    resize: vertical; 
} 
 
.gender { 
    display: flex; 
    gap: 15px; 
} 
 
.gender label { 
    display: flex; 
    align-items: center; 
    gap: 8px; 
 
    padding: 10px 18px; 
 
    background: #f5ecff; 
    border: 2px solid #e1cdf1; 
    border-radius: 20px; 
 
    cursor: pointer; 
    transition: 0.3s; 
} 
 
.gender label:hover { 
    background: #ead9ff; 
    border-color: #b47bd5; 
    transform: translateY(-2px); 
} 
 
.gender input { 
    width: auto; 
    accent-color: #914fc0; 
} 
 
button { 
    border: none; 
    padding: 14px 28px; 
 
    font-family: 'Poppins', sans-serif; 
    font-size: 15px; 
    font-weight: 600; 
 
    color: white; 
    background: linear-gradient(135deg, #a35bd1, #753b9b); 
 
    border-radius: 30px; 
    cursor: pointer; 
 
    box-shadow: 
        0 7px 15px rgba(117, 59, 155, 0.25); 
 
    transition: all 0.3s ease; 
} 
 
button::after { 
    content: " ✨"; 
} 
 
button:hover { 
    transform: translateY(-3px); 
    box-shadow: 
        0 10px 20px rgba(117, 59, 155, 0.35); 
 
    background: linear-gradient(135deg, #b66de0, #8145a7); 
} 
 
button:active { 
    transform: translateY(0); 
} 
 
.reset-btn { 
    background: linear-gradient(135deg, #d39be9, #a85ac7); 
} 
 
.reset-btn:hover { 
    background: linear-gradient(135deg, #e0acef, #b76bd4); 
} 
 
#message { 
    margin-top: 20px; 
    padding: 14px 18px; 
 
    border-radius: 15px; 
    font-weight: 600; 
 
    text-align: center; 
} 
 
.success { 
    display: block !important; 
    color: #64347c; 
    background: #eee0ff; 
    border: 2px solid #d3b3ec; 
} 
 
.error { 
    display: block !important; 
    color: #8b376d; 
    background: #ffe5f5; 
    border: 2px solid #efb8da; 
} 
 
.table-container { 
    overflow-x: auto; 
    border-radius: 18px; 
 
    box-shadow: 0 5px 20px rgba(110, 61, 143, 0.1); 
} 
 
table { 
    width: 100%; 
    border-collapse: collapse; 
    overflow: hidden; 
 
    background: white; 
} 
 
th { 
    padding: 15px; 
    color: white; 
 
    background: linear-gradient( 
        135deg, 
        #9c56c5, 
        #713994 
    ); 
 
    font-weight: 600; 
} 
 
td { 
    padding: 13px; 
    border-bottom: 1px solid #eadcf4; 
    color: #603b70; 
} 
 
tr:nth-child(even) { 
    background: #faf6ff; 
} 
 
tr:hover { 
    background: #f1e5ff; 
} 
 
tbody tr td:first-child::before { 
    content: "💜 "; 
} 
 
@media (max-width: 600px) { 
 
    body { 
        padding: 15px 10px; 
    } 
 
    .container { 
        padding: 25px 18px; 
        border-radius: 24px; 
    } 
 
    h1 { 
        font-size: 34px; 
    } 
 
    h2 { 
        font-size: 26px; 
    } 
 
    .gender { 
        flex-direction: column; 
        gap: 8px; 
    } 
 
    .gender label { 
        width: 100%; 
    } 
 
    button { 
        width: 100%; 
        margin-bottom: 10px; 
    } 
}

</style>

</head>


<body>

<div class="container">

    <h1>Student Registration</h1>


    <!-- ================= FORM ================= -->

    <form id="studentForm">

        <div class="form-group">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter 10 digit phone number"
                maxlength="10"
                required
            >

        </div>


        <!-- DOB ADDED -->

        <div class="form-group">

            <label for="dob">Date of Birth</label>

            <input
                type="date"
                id="dob"
                required
            >

        </div>


        <!-- GENDER -->

        <div class="form-group">

            <label>Gender</label>

            <div class="gender">

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Female"
                    >
                    Female
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Male"
                    >
                    Male
                </label>

                <label>
                    <input
                        type="radio"
                        name="gender"
                        value="Other"
                    >
                    Other
                </label>

            </div>

        </div>


        <!-- COURSE -->

        <div class="form-group">

            <label for="course">Course</label>

            <select id="course" required>

                <option value="">
                    Select your course
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Artificial Intelligence">
                    Artificial Intelligence
                </option>

                <option value="Information Technology">
                    Information Technology
                </option>

                <option value="Electronics">
                    Electronics
                </option>

            </select>

        </div>


        <!-- MESSAGE -->

        <div class="form-group">

            <label for="studentMessage">Message</label>

            <textarea
                id="studentMessage"
                rows="4"
                placeholder="Write something here..."
            ></textarea>

        </div>


        <!-- BUTTONS -->

        <button type="submit">
            Save Record
        </button>

        <button
            type="reset"
            class="reset-btn"
        >
            Reset
        </button>


        <!-- MESSAGE -->

        <div id="message"></div>

    </form>


    <!-- ================= TABLE ================= -->

    <h2>Saved Student Records</h2>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Phone</th>

                    <th>DOB</th>

                    <th>Gender</th>

                    <th>Course</th>

                    <th>Message</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="studentTable">

            </tbody>

        </table>

    </div>


    <br>


    <!-- CLEAR ALL BUTTON -->

    <button
        type="button"
        id="clearAll"
    >
        Clear All Records
    </button>


</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

/*
    ==========================================
    STUDENT REGISTRATION SYSTEM
    ==========================================
*/


const form = document.getElementById("studentForm");

const table = document.getElementById("studentTable");

const messageBox = document.getElementById("message");

const clearAllButton = document.getElementById("clearAll");



/*
    GET SAVED RECORDS

    If records already exist in the browser,
    load them.

    Otherwise create an empty array.
*/

let students =
    JSON.parse(
        localStorage.getItem("studentRecords")
    ) || [];



/*
    DISPLAY RECORDS
*/

function displayRecords() {

    table.innerHTML = "";


    /*
        If there are no records
    */

    if (students.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="8"
                    style="text-align:center;">
                    No student records yet 💜
                </td>
            </tr>
        `;

        return;
    }


    /*
        Display every student
    */

    students.forEach((student, index) => {

        const row = document.createElement("tr");


        row.innerHTML = `

            <td>${student.name}</td>

            <td>${student.email}</td>

            <td>${student.phone}</td>

            <td>${student.dob}</td>

            <td>${student.gender}</td>

            <td>${student.course}</td>

            <td>${student.message || "-"}</td>

            <td>

                <button
                    type="button"
                    onclick="deleteRecord(${index})"
                    style="
                        padding:8px 14px;
                        font-size:12px;
                        background:#b84f91;
                    "
                >
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });

}



/*
    SHOW MESSAGE
*/

function showMessage(text, type) {

    messageBox.textContent = text;

    messageBox.className = type;


    /*
        Automatically hide message
    */

    setTimeout(() => {

        messageBox.textContent = "";

        messageBox.className = "";

    }, 3000);

}



/*
    SUBMIT FORM
*/

form.addEventListener(
    "submit",
    function(event) {

        /*
            Prevent page refresh
        */

        event.preventDefault();


        /*
            GET VALUES
        */

        const name =
            document.getElementById("name")
            .value.trim();


        const email =
            document.getElementById("email")
            .value.trim();


        const phone =
            document.getElementById("phone")
            .value.trim();


        const dob =
            document.getElementById("dob")
            .value;


        const course =
            document.getElementById("course")
            .value;


        const studentMessage =
            document.getElementById("studentMessage")
            .value.trim();


        const gender =
            document.querySelector(
                'input[name="gender"]:checked'
            );



        /*
            VALIDATION
        */


        if (
            name === "" ||
            email === "" ||
            phone === "" ||
            dob === "" ||
            course === ""
        ) {

            showMessage(
                "Please fill all required fields 💜",
                "error"
            );

            return;

        }



        /*
            CHECK GENDER
        */

        if (!gender) {

            showMessage(
                "Please select your gender 💜",
                "error"
            );

            return;

        }



        /*
            PHONE VALIDATION
        */

        if (
            !/^[0-9]{10}$/.test(phone)
        ) {

            showMessage(
                "Please enter a valid 10-digit phone number 📱",
                "error"
            );

            return;

        }



        /*
            CREATE STUDENT RECORD
        */

        const student = {

            name: name,

            email: email,

            phone: phone,

            dob: dob,

            gender: gender.value,

            course: course,

            message: studentMessage

        };



        /*
            ADD TO ARRAY
        */

        students.push(student);



        /*
            SAVE TO LOCAL STORAGE
        */

        localStorage.setItem(
            "studentRecords",
            JSON.stringify(students)
        );



        /*
            UPDATE TABLE
        */

        displayRecords();



        /*
            SUCCESS MESSAGE
        */

        showMessage(
            "Record saved successfully! 💜✨",
            "success"
        );



        /*
            RESET FORM
        */

        form.reset();

    }
);



/*
    DELETE INDIVIDUAL RECORD
*/

function deleteRecord(index) {


    const confirmation =
        confirm(
            "Are you sure you want to delete this record?"
        );


    if (!confirmation) {

        return;

    }


    /*
        Remove record
    */

    students.splice(index, 1);


    /*
        Update local storage
    */

    localStorage.setItem(
        "studentRecords",
        JSON.stringify(students)
    );


    /*
        Refresh table
    */

    displayRecords();


    /*
        Show message
    */

    showMessage(
        "Record deleted successfully 🗑️",
        "success"
    );

}



/*
    RESET BUTTON
*/

form.addEventListener(
    "reset",
    function() {

        /*
            Reset automatically clears:

            Name
            Email
            Phone
            DOB
            Gender
            Course
            Message
        */


        messageBox.textContent = "";

        messageBox.className = "";

    }
);



/*
    CLEAR ALL RECORDS
*/

clearAllButton.addEventListener(
    "click",
    function() {


        /*
            Check if records exist
        */

        if (students.length === 0) {

            showMessage(
                "There are no records to clear.",
                "error"
            );

            return;

        }


        /*
            Confirmation
        */

        const confirmation =
            confirm(
                "Are you sure you want to delete ALL records?"
            );


        if (!confirmation) {

            return;

        }


        /*
            Empty array
        */

        students = [];


        /*
            Remove local storage
        */

        localStorage.removeItem(
            "studentRecords"
        );


        /*
            Update table
        */

        displayRecords();


        /*
            Show message
        */

        showMessage(
            "All records have been cleared 🧹💜",
            "success"
        );

    }
);



/*
    LOAD SAVED RECORDS
    WHEN PAGE OPENS
*/

displayRecords();

</script>

</body>

</html>
